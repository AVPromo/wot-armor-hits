<!doctype html>
<html><head><meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; background: #16181c; }
svg { display: block; }
text { font-family: "Segoe UI", Arial, sans-serif; fill: #e8e6e1; }
.mono { font-family: Consolas, "Courier New", monospace; font-size: 19px; }
.title { font-size: 24px; font-weight: 600; }
.dim { fill: #8d8a83; }
.hl { fill: #f5c542; }
.step { font-size: 22px; font-weight: 600; fill: #16181c; }
.line { display: flex; align-items: center; gap: 8px; height: 48px; font-family: "Segoe UI", Arial, sans-serif;
        font-size: 24px; font-weight: 600; color: #e8e6e1; white-space: nowrap; }
.line img { width: 40px; height: 40px; }
.hlText { color: #f5c542; }
</style></head>
<body>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="folder" viewBox="0 0 24 20">
      <path d="M1 3a2 2 0 0 1 2-2h6l2 3h10a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#9c8656"/>
    </symbol>
    <symbol id="file" viewBox="0 0 20 24">
      <path d="M2 1h11l5 5v17H2z" fill="#9fb6d4"/><path d="M13 1v5h5" fill="#6f87a8"/>
    </symbol>
    <symbol id="exe" viewBox="0 0 24 24">
      <rect x="1" y="1" width="22" height="22" rx="4" fill="#b8473a"/>
      <path d="M6 16l6-9 6 9z" fill="#f0d9a0"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f5c542"/>

  <!-- Archive -->

  <circle cx="74" cy="34" r="18" fill="#f5c542"/><text x="74" y="42" text-anchor="middle" class="step">1</text>
  <text x="104" y="42" class="title">Open the archive</text>
  <use href="#folder" x="70" y="96" width="30" height="25"/>
  <text x="112" y="116" class="mono hl">mods</text>
  <rect x="64" y="88" width="432" height="40" rx="8" fill="none" stroke="#f5c542" stroke-width="2.5"/>
  <use href="#folder" x="100" y="146" width="26" height="22"/>
  <text x="138" y="164" class="mono">2.4.1.0</text>
  <use href="#folder" x="130" y="190" width="26" height="22"/>
  <text x="168" y="208" class="mono">net.openwg</text>
  <use href="#file" x="162" y="232" width="18" height="22"/>
  <text x="190" y="250" class="mono dim">net.openwg.gameface_….wotmod</text>
  <use href="#file" x="132" y="274" width="18" height="22"/>
  <text x="160" y="292" class="mono dim">me.poliroid.modslistapi_….wotmod</text>
  <use href="#file" x="132" y="316" width="18" height="22"/>
  <text x="160" y="334" class="mono hl" font-weight="600">sagtary.armor_hits_1.0.0.wotmod</text>

  <!-- Arrow -->
  <path d="M532 108 C 580 108, 620 108, 664 108" fill="none" stroke="#f5c542" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="598" cy="34" r="18" fill="#f5c542"/><text x="598" y="42" text-anchor="middle" class="step">2</text>
  <text x="628" y="42" class="title">Copy <tspan class="mono hl" font-size="22">mods</tspan> to the game folder</text>
  <text x="598" y="92" text-anchor="middle" class="hl" font-size="20" font-weight="600">copy</text>

  <!-- Game folder -->
  <rect x="680" y="60" width="440" height="320" rx="14" fill="#202329" stroke="#3a3e46" stroke-width="2"/>
  <use href="#folder" x="710" y="96" width="30" height="25"/>
  <text x="752" y="116" class="mono">World_of_Tanks_EU</text>
  <use href="#exe" x="740" y="142" width="24" height="24"/>
  <text x="776" y="161" class="mono">WorldOfTanks.exe</text>
  <use href="#folder" x="740" y="186" width="26" height="22"/>
  <text x="778" y="204" class="mono">res</text>
  <use href="#folder" x="740" y="228" width="26" height="22"/>
  <text x="778" y="246" class="mono hl">mods</text>
  <rect x="730" y="220" width="368" height="38" rx="8" fill="none" stroke="#f5c542" stroke-width="2.5"/>
  <use href="#folder" x="770" y="270" width="26" height="22"/>
  <text x="808" y="288" class="mono dim">2.4.1.0</text>
  <use href="#file" x="740" y="312" width="18" height="22"/>
  <text x="768" y="330" class="mono dim">version.xml</text>
  <text x="710" y="364" class="dim" font-size="18">the folder where WorldOfTanks.exe is</text>

  <!-- Step 3 -->
  <circle cx="74" cy="420" r="18" fill="#f5c542"/><text x="74" y="428" text-anchor="middle" class="step">3</text>
  <text x="104" y="428" class="title">Check: these files are in the game folder</text>
  <rect x="40" y="444" width="1080" height="364" rx="14" fill="#202329" stroke="#3a3e46" stroke-width="2"/>
  <use href="#folder" x="70" y="470" width="30" height="25"/>
  <text x="112" y="490" class="mono">World_of_Tanks_EU</text>
  <use href="#exe" x="110" y="516" width="24" height="24"/>
  <text x="146" y="535" class="mono">WorldOfTanks.exe</text>
  <use href="#folder" x="110" y="560" width="26" height="22"/>
  <text x="148" y="578" class="mono">mods</text>
  <use href="#folder" x="150" y="602" width="26" height="22"/>
  <text x="188" y="620" class="mono">2.4.1.0</text>
  <use href="#file" x="190" y="644" width="18" height="22"/>
  <text x="218" y="662" class="mono hl" font-weight="600">sagtary.armor_hits_1.0.0.wotmod</text>
  <use href="#file" x="190" y="686" width="18" height="22"/>
  <text x="218" y="704" class="mono">me.poliroid.modslistapi_1.8.0.wotmod</text>
  <use href="#folder" x="190" y="728" width="26" height="22"/>
  <text x="228" y="746" class="mono">net.openwg</text>
  <use href="#file" x="230" y="770" width="18" height="22"/>
  <text x="258" y="788" class="mono">net.openwg.gameface_1.2.2.wotmod</text>
  <!-- Step 4 -->
  <circle cx="74" cy="856" r="18" fill="#f5c542"/><text x="74" y="864" text-anchor="middle" class="step">4</text>
  <foreignObject x="104" y="832" width="1060" height="48">
    <div xmlns="http://www.w3.org/1999/xhtml" class="line">
      Start the game and click
      <img src="../resources/gui/maps/sagtary_armor_hits/icon.png" alt=""/>
      <span class="hlText">Armor Hits</span> in the hangar
    </div>
  </foreignObject>
</svg>
</body></html>
