name: Bug report
description: Something in the mod does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mod version
      description: From the file name, for example sagtary.armor_hits_1.0.0.wotmod.
      placeholder: 1.0.0
  - type: textarea
    id: log
    attributes:
      label: game.log
      description: Drag game.log from the game folder (where WorldOfTanks.exe is) here.
  - type: textarea
    id: hits
    attributes:
      label: Battle file
      description: >-
        For a problem with the hits of a battle: select the battle, click Save battle in the mod's settings and drag
        its file hits_<number>.json from mods/sagtary_armor_hits/hits/ in the game folder here.
